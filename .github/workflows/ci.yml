name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Full gate (format, lint, type-check, tests with coverage, exports tested, docs)
        run: deno task ci

      - name: Publish dry run
        run: deno publish --dry-run
